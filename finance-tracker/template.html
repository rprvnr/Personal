<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Tracker</title>
<style>
/* Layout: summary strip -> monthly chart + category bars -> review queue -> full ledger. True black, like the task tracker. */
:root {
  --bg: #000000;
  --surface: #0b0b0e;
  --surface-2: #15151b;
  --ink: #f1f1f5;
  --muted: #8a8a99;
  --line: #22222a;
  --accent: #4cc9f0;
  --income: #3ddc84;
  --spend: #ff6b6b;
  --warn: #ffd23f;
  --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; justify-content: space-between; }
h1 { font-family: var(--font-display); font-size: 30px; letter-spacing: -0.03em; margin: 0; line-height: 1; }
.sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; text-wrap: balance; }
.num, td.amt, .tile b { font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, input { font: inherit; color: var(--ink); }
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: #001018; border-color: var(--accent); font-weight: 700; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: #000; border-color: var(--ink); font-weight: 700; }
.status { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.tile span { display: block; color: var(--muted); font-size: 12px; }
.tile b { display: block; font-size: 26px; letter-spacing: -0.02em; margin-top: 6px; }
.tile small { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.gaps { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.gaps ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.gaps li { color: var(--ink); }
.gaps li em { color: var(--muted); font-style: normal; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 170px 1fr 92px; gap: 10px; align-items: center; cursor: pointer; border-radius: 8px; padding: 2px 4px; background: none; border: 0; text-align: left; }
.bar:hover { background: var(--surface-2); }
.bar .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.bar .trk { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 999px; background: var(--spend); }
.bar .v { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar .v small { color: var(--muted); display: block; font-size: 11px; }
.bar.active { background: var(--surface-2); outline: 1px solid var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.filters input { flex: 1 1 200px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 8px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.off td { opacity: .45; }
tr.off td.ctl { opacity: 1; }
td.amt { text-align: right; white-space: nowrap; }
td.amt.in { color: var(--income); }
td.date { white-space: nowrap; color: var(--muted); }
td.m b { font-weight: 600; }
td.m small { display: block; color: var(--muted); font-size: 11px; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.m .note { color: var(--warn); white-space: normal; }
td select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; font-size: 12px; max-width: 190px; }
.tog { width: 38px; height: 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; cursor: pointer; padding: 0; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.tog[aria-checked="true"] { background: color-mix(in srgb, var(--income) 30%, var(--surface-2)); border-color: var(--income); }
.tog[aria-checked="true"]::after { left: 18px; background: var(--income); }
.pill { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.pill.review { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); }
.pill.edited { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 11px; padding: 0; margin-left: 6px; }
.rules { display: grid; gap: 6px; }
.rules div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; border-bottom: 1px solid var(--line); padding: 6px 0; }
.muted { color: var(--muted); }
.more { margin-top: 10px; }
@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 120px 1fr 80px; }
}
@media (prefers-reduced-motion: reduce) { .tog::after { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Money Tracker</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="row">
      <span class="status" id="status">Loading your edits…</span>
      <button class="btn primary" id="export" hidden>Download Excel</button>
    </div>
  </header>

  <div class="row" id="months" role="group" aria-label="Period"></div>

  <section class="tiles" id="tiles"></section>

  <section class="card gaps" id="gaps">
    <h2>Gaps in the data</h2>
    <ul id="gaplist"></ul>
  </section>

  <section class="card">
    <h2>Income vs spending by month</h2>
    <div class="legend"><span><i style="background:var(--income)"></i>Income</span><span><i style="background:var(--spend)"></i>Spending</span><span><i style="background:var(--muted)"></i>Part of income from Dad</span><span>Click a month to focus on it</span></div>
    <div id="chart"></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>Where the money went</h2>
      <div class="bars" id="cats"></div>
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card">
        <h2>Top merchants</h2>
        <div class="bars" id="merchants"></div>
      </div>
      <div class="card">
        <h2>Income sources</h2>
        <div class="bars" id="incomes"></div>
        <h2 style="margin-top:20px">Your rules</h2>
        <div class="rules" id="rules"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Transactions</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="Search merchant or narration" aria-label="Search transactions">
      <select id="fcat" aria-label="Category"></select>
      <select id="facct" aria-label="Account"></select>
      <select id="fstate" aria-label="Show">
        <option value="all">All transactions</option>
        <option value="counted">Counted only</option>
        <option value="excluded">Excluded only</option>
        <option value="review">Needs review</option>
        <option value="edited">Edited by you</option>
      </select>
    </div>
    <div class="muted" id="tsum" style="font-size:12px;margin-bottom:8px"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Date</th><th>Merchant</th><th>Account</th><th>Category</th><th style="text-align:right">Amount</th><th>Count</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <button class="btn more" id="more" hidden>Show more</button>
  </section>
</div>

<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const TX = DATA.transactions, CATS = DATA.categories, GAPS = DATA.gaps;
const CAT_NAMES = Object.keys(CATS);
let state = { overrides: {}, rules: {} };   // overrides[id] = {cat?, inc?}; rules[merchant] = {cat?, inc?}
let period = "all", catFilter = "", shown = 150;
let db = null, docRef = null, saveTimer = null;

const fmt = n => (n < -0.5 ? "−₹" : "₹") + Math.abs(Math.round(n)).toLocaleString("en-IN");
const fmtK = n => Math.abs(n) >= 100000 ? "₹" + (n / 100000).toFixed(2) + "L" : Math.abs(n) >= 1000 ? "₹" + (n / 1000).toFixed(1) + "k" : fmt(n);
const monthKey = d => d.slice(0, 7);
const monthName = k => new Date(k + "-01T00:00:00").toLocaleString("en-IN", { month: "short", year: "2-digit" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function eff(t) {
  const o = state.overrides[t.id] || {}, r = state.rules[t.merchant] || {};
  const cat = o.cat || r.cat || t.category;
  const group = CATS[cat];
  let inc = o.inc !== undefined ? o.inc : (r.inc !== undefined ? r.inc : group !== "excluded");
  // signed contribution: spending adds outflows and subtracts refunds; income the reverse
  let spend = 0, income = 0;
  if (inc) {
    if (group === "income") income = t.dir === "in" ? t.amount : -t.amount;
    else if (group === "spend") spend = t.dir === "out" ? t.amount : -t.amount;
    else if (t.dir === "out") spend = t.amount; else income = t.amount;
  }
  return { cat, group, inc, spend, income, edited: !!(state.overrides[t.id] || state.rules[t.merchant]) };
}

const MONTHS = [...new Set(TX.map(t => monthKey(t.date)))].sort();
// "Last 3 months" = the three complete months before the current (partial) month.
const LAST3 = MONTHS.slice(-4, -1);
function periodMonths() { return period === "all" ? MONTHS : period === "last3" ? LAST3 : [period]; }
function inPeriod(t) { return period === "all" || periodMonths().includes(monthKey(t.date)); }

function renderMonths() {
  const el = document.getElementById("months");
  el.innerHTML = [["all", "All months"], ["last3", `Last 3 months (${monthName(LAST3[0])} – ${monthName(LAST3[2])})`], ...MONTHS.map(m => [m, monthName(m)])]
    .map(([k, l]) => `<button class="chip" aria-pressed="${period === k}" data-k="${k}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { period = b.dataset.k; shown = 150; render(); });
}

function totals(filter) {
  let inc = 0, sp = 0, dad = 0;
  for (const t of TX) { if (!filter(t)) continue; const e = eff(t); inc += e.income; sp += e.spend; if (e.cat === "From Dad") dad += e.income; }
  return { inc, sp, dad };
}

function renderTiles() {
  const T = totals(inPeriod);
  const own = T.inc - T.dad;
  const n = periodMonths().length;
  const saved = T.inc - T.sp;
  const rate = T.inc ? Math.round(saved / T.inc * 100) : 0;
  document.getElementById("tiles").innerHTML = `
    <div class="tile"><span>Income</span><b style="color:var(--income)">${fmt(T.inc)}</b><small>${fmt(own)} earned · ${fmt(T.dad)} from Dad</small></div>
    <div class="tile"><span>Spending</span><b style="color:var(--spend)">${fmt(T.sp)}</b><small>${n > 1 ? fmt(T.sp / n) + " a month on average" : "this month"}</small></div>
    <div class="tile"><span>Left over</span><b>${fmt(saved)}</b><small>${rate}% of income</small></div>
    <div class="tile"><span>Transactions counted</span><b>${TX.filter(t => inPeriod(t) && eff(t).inc).length}</b><small>${TX.filter(t => inPeriod(t) && !eff(t).inc).length} excluded</small></div>`;
}

function renderGaps() {
  document.getElementById("gaplist").innerHTML = GAPS.map(g => `<li>${esc(g.title)} <em>${esc(g.detail)}</em></li>`).join("");
  document.getElementById("gaps").hidden = !GAPS.length;
}

function renderChart() {
  const rows = MONTHS.map(m => { const T = totals(t => monthKey(t.date) === m); return { m, ...T }; });
  const W = 1100, H = 220, L = 50, B = 24, top = 10;
  const max = Math.max(1, ...rows.map(r => Math.max(r.inc, r.sp)));
  const step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const ymax = Math.ceil(max / step) * step;
  const y = v => top + (H - top - B) * (1 - v / ymax);
  const bw = (W - L) / rows.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly income and spending">`;
  for (let v = 0; v <= ymax; v += step) s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtK(v)}</text>`;
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * 0.14, w = bw * 0.34, sel = periodMonths().includes(r.m);
    const op = sel ? 1 : 0.35;
    s += `<g opacity="${op}" style="cursor:pointer" data-m="${r.m}">`;
    s += `<rect x="${x}" y="${y(Math.max(r.inc, 0))}" width="${w}" height="${y(0) - y(Math.max(r.inc, 0))}" rx="3" fill="var(--income)"/>`;
    if (r.dad > 0) s += `<rect x="${x}" y="${y(Math.max(r.inc, 0))}" width="${w}" height="${y(0) - y(r.dad)}" rx="3" fill="var(--muted)" opacity=".8"/>`;
    s += `<rect x="${x + w + 2}" y="${y(Math.max(r.sp, 0))}" width="${w}" height="${y(0) - y(Math.max(r.sp, 0))}" rx="3" fill="var(--spend)"/>`;
    s += `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${monthName(r.m)}</text>`;
    s += `<rect x="${L + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"><title>${monthName(r.m)}: income ${fmt(r.inc)}, spending ${fmt(r.sp)}</title></rect></g>`;
  });
  s += `</svg>`;
  const el = document.getElementById("chart");
  el.innerHTML = s;
  el.querySelectorAll("g[data-m]").forEach(g => g.onclick = () => { period = period === g.dataset.m ? "all" : g.dataset.m; render(); });
}

function barList(elId, entries, color, onClick, activeKey) {
  const max = Math.max(1, ...entries.map(e => e[1]));
  const total = entries.reduce((a, e) => a + Math.max(e[1], 0), 0);
  const el = document.getElementById(elId);
  el.innerHTML = entries.map(([k, v, n]) => `<button class="bar${activeKey === k ? " active" : ""}" data-k="${esc(k)}">
      <span class="lbl" title="${esc(k)}">${esc(k)}</span>
      <span class="trk"><span class="fill" style="display:block;width:${Math.max(0, v / max * 100)}%;background:${color}"></span></span>
      <span class="v">${fmt(v)}<small>${total ? Math.round(v / total * 100) : 0}%${n ? " · " + n + " txns" : ""}</small></span></button>`).join("") || `<span class="muted">Nothing counted in this period.</span>`;
  if (onClick) el.querySelectorAll(".bar").forEach(b => b.onclick = () => onClick(b.dataset.k));
}

function renderBreakdowns() {
  const byCat = {}, byMer = {}, byInc = {};
  for (const t of TX) {
    if (!inPeriod(t)) continue;
    const e = eff(t);
    if (e.spend) { (byCat[e.cat] ||= [0, 0]); byCat[e.cat][0] += e.spend; byCat[e.cat][1]++; }
    if (e.spend) { (byMer[t.merchant] ||= [0, 0]); byMer[t.merchant][0] += e.spend; byMer[t.merchant][1]++; }
    if (e.income) { (byInc[e.cat] ||= [0, 0]); byInc[e.cat][0] += e.income; byInc[e.cat][1]++; }
  }
  const sorted = o => Object.entries(o).map(([k, [v, n]]) => [k, v, n]).filter(e => Math.abs(e[1]) > 0.5).sort((a, b) => b[1] - a[1]);
  barList("cats", sorted(byCat), "var(--spend)", k => { catFilter = catFilter === k ? "" : k; document.getElementById("fcat").value = catFilter; shown = 150; render(); document.getElementById("tbody").scrollIntoView({ behavior: "smooth", block: "start" }); }, catFilter);
  barList("merchants", sorted(byMer).slice(0, 12), "var(--accent)", k => { document.getElementById("q").value = k; shown = 150; renderTable(); });
  barList("incomes", sorted(byInc), "var(--income)");
}

function renderRules() {
  const el = document.getElementById("rules");
  const keys = Object.keys(state.rules);
  el.innerHTML = keys.length ? keys.map(k => { const r = state.rules[k];
    const what = [r.inc === false ? "always excluded" : r.inc === true ? "always counted" : "", r.cat ? "always " + r.cat : ""].filter(Boolean).join(", ");
    return `<div><span><b>${esc(k)}</b> <span class="muted">${esc(what)}</span></span><button class="linkbtn" data-k="${esc(k)}">Remove</button></div>`; }).join("")
    : `<span class="muted" style="font-size:13px">None yet. In the table, use "Apply to all from this merchant" after changing a category or switching a row off.</span>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { delete state.rules[b.dataset.k]; changed(); });
}

function fillSelects() {
  const fc = document.getElementById("fcat");
  fc.innerHTML = `<option value="">All categories</option>` + CAT_NAMES.map(c => `<option>${esc(c)}</option>`).join("");
  const fa = document.getElementById("facct");
  fa.innerHTML = `<option value="">All accounts</option>` + [...new Set(TX.map(t => t.account))].map(a => `<option>${esc(a)}</option>`).join("");
  fc.onchange = () => { catFilter = fc.value; shown = 150; render(); };
  ["q", "facct", "fstate"].forEach(id => document.getElementById(id).addEventListener("input", () => { shown = 150; renderTable(); }));
}

const catOptions = CAT_NAMES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

function renderTable() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const acct = document.getElementById("facct").value, st = document.getElementById("fstate").value;
  const rows = [];
  let net = 0;
  for (let i = TX.length - 1; i >= 0; i--) {
    const t = TX[i]; if (!inPeriod(t)) continue;
    const e = eff(t);
    if (catFilter && e.cat !== catFilter) continue;
    if (acct && t.account !== acct) continue;
    if (q && !(t.merchant + " " + t.desc).toLowerCase().includes(q)) continue;
    if (st === "counted" && !e.inc) continue;
    if (st === "excluded" && e.inc) continue;
    if (st === "review" && !(t.review && !e.edited)) continue;
    if (st === "edited" && !e.edited) continue;
    net += e.spend - e.income;
    rows.push([t, e]);
  }
  document.getElementById("tsum").textContent = `${rows.length} transactions · net counted spending ${fmt(net)}`;
  document.getElementById("tbody").innerHTML = rows.slice(0, shown).map(([t, e]) => `
    <tr class="${e.inc ? "" : "off"}" data-id="${t.id}">
      <td class="date">${new Date(t.date + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short" })}</td>
      <td class="m"><b>${esc(t.merchant)}</b>${t.review && !e.edited ? '<span class="pill review">Review</span>' : ""}${e.edited ? '<span class="pill edited">Edited</span>' : ""}
        <small title="${esc(t.desc)}">${esc(t.desc)}</small>${t.note ? `<small class="note">${esc(t.note)}</small>` : ""}</td>
      <td class="muted" style="white-space:nowrap">${esc(t.account)}</td>
      <td class="ctl"><select aria-label="Category for ${esc(t.merchant)}" data-act="cat">${catOptions.replace(`value="${esc(e.cat)}"`, `value="${esc(e.cat)}" selected`)}</select>
        <br><button class="linkbtn" data-act="rule">Apply to all from this merchant</button>${state.overrides[t.id] ? '<button class="linkbtn" data-act="reset">Reset</button>' : ""}</td>
      <td class="amt ${t.dir === "in" ? "in" : ""}">${t.dir === "in" ? "+" : "−"}${fmt(t.amount)}</td>
      <td class="ctl"><button class="tog" role="switch" aria-checked="${e.inc}" aria-label="Count this transaction" data-act="inc"></button></td>
    </tr>`).join("");
  document.getElementById("more").hidden = rows.length <= shown;
}

document.getElementById("tbody").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const id = b.closest("tr").dataset.id, t = TX.find(x => x.id === id), e = eff(t);
  if (b.dataset.act === "inc") { (state.overrides[id] ||= {}).inc = !e.inc; changed(); }
  if (b.dataset.act === "reset") { delete state.overrides[id]; changed(); }
  if (b.dataset.act === "rule") {
    const o = state.overrides[id] || {};
    const r = state.rules[t.merchant] || {};
    r.cat = e.cat; if (o.inc !== undefined || !e.inc) r.inc = e.inc;
    state.rules[t.merchant] = r;
    for (const x of TX) if (x.merchant === t.merchant && state.overrides[x.id]) delete state.overrides[x.id];
    changed();
  }
});
document.getElementById("tbody").addEventListener("change", ev => {
  const s = ev.target.closest("select[data-act=cat]"); if (!s) return;
  const id = s.closest("tr").dataset.id;
  const o = (state.overrides[id] ||= {}); o.cat = s.value; delete o.inc;
  changed();
});
document.getElementById("more").onclick = () => { shown += 300; renderTable(); };

function render() { renderMonths(); renderTiles(); renderChart(); renderBreakdowns(); renderRules(); renderTable(); }

function setStatus(s) { document.getElementById("status").textContent = s; }
function changed() {
  render();
  try { localStorage.setItem("money-tracker-state", JSON.stringify(state)); } catch (e) {}
  if (!docRef) { setStatus("Saved in this browser only"); return; }
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
}
let writing = false, dirty = false;
async function flush() {
  if (writing) { dirty = true; return; }
  writing = true;
  do {
    dirty = false;
    try { await docRef.set({ overrides: state.overrides, rules: state.rules, updated: new Date().toISOString() }); setStatus("Saved to your account"); }
    catch (e) { setStatus("Couldn't save to your account. Kept in this browser."); }
  } while (dirty);
  writing = false;
}

// ---------- Excel export (reflects your edits) ----------
function buildWorkbook() {
  const wb = XLSX.utils.book_new();
  const tx = TX.map(t => { const e = eff(t); return {
    Date: t.date, Month: monthName(monthKey(t.date)), Account: t.account, Merchant: t.merchant, Category: e.cat, Group: e.group,
    Direction: t.dir === "in" ? "In" : "Out", Amount: t.amount, Counted: e.inc ? "Yes" : "No",
    "Counted spending": Math.round(e.spend * 100) / 100, "Counted income": Math.round(e.income * 100) / 100,
    Note: t.note || "", Narration: t.desc }; });
  const ws = XLSX.utils.json_to_sheet(tx);
  ws["!cols"] = [10, 8, 18, 28, 26, 9, 9, 11, 8, 14, 14, 40, 70].map(w => ({ wch: w }));
  const months = MONTHS.map(m => { const T = totals(t => monthKey(t.date) === m);
    return { Month: monthName(m), Income: Math.round(T.inc), "Of which from Dad": Math.round(T.dad), Spending: Math.round(T.sp), "Left over": Math.round(T.inc - T.sp) }; });
  const all = totals(() => true);
  months.push({ Month: "Total", Income: Math.round(all.inc), "Of which from Dad": Math.round(all.dad), Spending: Math.round(all.sp), "Left over": Math.round(all.inc - all.sp) });
  const ms = XLSX.utils.json_to_sheet(months); ms["!cols"] = [{ wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 12 }, { wch: 12 }];
  const cats = CAT_NAMES.filter(c => CATS[c] === "spend").map(c => { const row = { Category: c }; let tot = 0;
    for (const m of MONTHS) { let v = 0; for (const t of TX) if (monthKey(t.date) === m) { const e = eff(t); if (e.cat === c) v += e.spend; } row[monthName(m)] = Math.round(v); tot += v; }
    row.Total = Math.round(tot); return row; }).filter(r => r.Total !== 0).sort((a, b) => b.Total - a.Total);
  const cs = XLSX.utils.json_to_sheet(cats); cs["!cols"] = [{ wch: 28 }, ...MONTHS.map(() => ({ wch: 9 })), { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ms, "Monthly summary");
  XLSX.utils.book_append_sheet(wb, cs, "Spending by category");
  XLSX.utils.book_append_sheet(wb, ws, "Transactions");
  return XLSX.write(wb, { bookType: "xlsx", type: "array" });
}

// ---------- boot ----------
document.getElementById("sub").textContent = `${TX.length} transactions · ${monthName(MONTHS[0])} to ${monthName(MONTHS[MONTHS.length - 1])} · ${[...new Set(TX.map(t => t.account))].length} accounts and cards · last updated ${DATA.built}`;
try { const s = JSON.parse(localStorage.getItem("money-tracker-state") || "null"); if (s) state = { overrides: s.overrides || {}, rules: s.rules || {} }; } catch (e) {}
fillSelects();
renderGaps();
render();

(async () => {
  if (!window.claude || !window.claude.use) { setStatus("Saved in this browser only"); return; }
  const timer = setTimeout(() => setStatus("Saved in this browser only"), 10000);
  try {
    const dl = await claude.use("downloads");
    if (dl && window.XLSX) {
      const btn = document.getElementById("export"); btn.hidden = false;
      btn.onclick = async () => {
        try { await dl.save({ filename: `money-tracker-${new Date().toISOString().slice(0, 10)}.xlsx`, data: new Uint8Array(buildWorkbook()) }); }
        catch (e) { if (e && e.code !== "declined") setStatus("Excel download isn't available here"); }
      };
    }
    db = await claude.use("db");
    if (!db) { clearTimeout(timer); setStatus("Saved in this browser only"); return; }
    docRef = db.doc("settings/state");
    const snap = await docRef.get();
    clearTimeout(timer);
    const d = snap && snap.exists ? snap.data() : null;
    if (d && (d.overrides || d.rules)) { state = { overrides: d.overrides || {}, rules: d.rules || {} }; render(); }
    setStatus("Saved to your account");
  } catch (e) { clearTimeout(timer); setStatus("Saved in this browser only"); }
})();
</script>
