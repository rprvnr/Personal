<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praveen's Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style id="css">
/* Layout: one narrow column, thumb-first. Quick-add pinned at top, then NOW / NEXT / LATER / DONE. */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --ink: #1b2030;
  --muted: #6b7286;
  --line: #e2e5ec;
  --accent: #d9822b;
  --accent-ink: #ffffff;
  --now: #d9822b;
  --next: #3c6fd8;
  --later: #8a8fa3;
  --done: #3f9a6b;
  --font-display: "Sora", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1b1e28; --ink: #eceef4; --muted: #9298ab; --line: #2a2e3b;
    --accent: #ef9a45; --accent-ink: #1b1306; --now: #ef9a45; --next: #6f9bf0; --later: #8d93a8; --done: #5dbb89;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1b1e28; --ink: #eceef4; --muted: #9298ab; --line: #2a2e3b;
  --accent: #ef9a45; --accent-ink: #1b1306; --now: #ef9a45; --next: #6f9bf0; --later: #8d93a8; --done: #5dbb89;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 64px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 22px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.summary { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.status { font-size: 13px; color: var(--muted); min-height: 1em; }
.status.warn { color: #c0392b; }

/* Quick add */
.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 8px; z-index: 5; box-shadow: 0 4px 16px rgba(20,24,40,.06); }
.add-row { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.add input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn:focus-visible, .chip:focus-visible, .check:focus-visible, .task-text:focus-visible, .sec-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 6px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Sections */
section { display: flex; flex-direction: column; gap: 6px; }
.sec-head { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.sec-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sec-head h2 { font-family: var(--font-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.sec-head .hint { color: var(--muted); font-size: 13px; }
.sec-head .count { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sec-head .caret { color: var(--muted); font-size: 12px; transition: transform .15s; }
section.collapsed .caret { transform: rotate(-90deg); }
section.collapsed .list { display: none; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.empty { padding: 14px; color: var(--muted); font-size: 14px; }

.task { border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task-main { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px; }
.check { flex: none; width: 24px; height: 24px; margin-top: 0; border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; font-size: 14px; line-height: 1; }
.task.done .check { background: var(--done); border-color: var(--done); color: #fff; }
.task-text { flex: 1; min-width: 0; background: none; border: 0; padding: 2px 0 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.task.done .task-text { color: var(--muted); text-decoration: line-through; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.when { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.actions { display: none; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px 48px; }
.task.open .actions { display: flex; }
.actions .chip.danger { color: #c0392b; border-color: currentColor; }
.clear { align-self: flex-end; font-size: 13px; padding: 6px 10px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

],"nextId":49}</script>
<script id="app">
(function () {
  var SECS = [
    { key: "now",   label: "Now",   hint: "this week",  color: "var(--now)" },
    { key: "next",  label: "Next",  hint: "next few weeks", color: "var(--next)" },
    { key: "later", label: "Later", hint: "no rush",    color: "var(--later)" },
    { key: "done",  label: "Done",  hint: "",           color: "var(--done)" }
  ];
  var state = JSON.parse(document.getElementById("state").textContent);
  var root = document.getElementById("root");
  var addSec = "now";
  var openId = null;
  var artifact = null, canSave = null, saveTimer = null, statusMsg = "Connecting…", statusWarn = false;

  var collapsed = { done: true };
  try { var c = JSON.parse(localStorage.getItem("tasks-collapsed") || "null"); if (c) collapsed = c; } catch (e) {}
  function saveCollapsed() { try { localStorage.setItem("tasks-collapsed", JSON.stringify(collapsed)); } catch (e) {} }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function today() { var d = new Date(); return d.toISOString().slice(0, 10); }
  function fmtDate(iso) { if (!iso) return ""; var d = new Date(iso + "T12:00:00"); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function find(id) { for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i]; return null; }

  function render() {
    var counts = { now: 0, next: 0, later: 0, done: 0 };
    state.tasks.forEach(function (t) { counts[t.sec] = (counts[t.sec] || 0) + 1; });
    var h = "";
    h += '<header><h1>Tasks</h1><span class="summary">' + counts.now + " now · " + (counts.next + counts.later) + " later · " + counts.done + " done</span></header>";
    h += '<form class="add" id="addForm" autocomplete="off"><div class="add-row">' +
         '<input id="addInput" type="text" placeholder="Add a task… (type or dictate)" aria-label="New task" enterkeyhint="done">' +
         '<button class="btn btn-primary" type="submit">Add</button></div><div class="seg" role="group" aria-label="Add to">';
    SECS.slice(0, 3).forEach(function (s) {
      h += '<button type="button" class="chip" data-addsec="' + s.key + '" aria-pressed="' + (addSec === s.key) + '">' + s.label + "</button>";
    });
    h += '</div><div class="status' + (statusWarn ? " warn" : "") + '" id="status">' + esc(statusMsg) + "</div></form>";

    SECS.forEach(function (s) {
      var items = state.tasks.filter(function (t) { return t.sec === s.key; });
      if (s.key === "done") items.sort(function (a, b) { return (b.doneAt || "").localeCompare(a.doneAt || ""); });
      var isCol = !!collapsed[s.key];
      h += '<section class="' + (isCol ? "collapsed" : "") + '">';
      h += '<button class="sec-head" data-toggle="' + s.key + '" aria-expanded="' + !isCol + '"><span class="caret">▼</span><span class="dot" style="background:' + s.color + '"></span><h2>' + s.label + "</h2>" +
           (s.hint ? '<span class="hint">' + s.hint + "</span>" : "") + '<span class="count">' + items.length + "</span></button>";
      h += '<ul class="list">';
      if (!items.length) h += '<li class="empty">' + (s.key === "done" ? "Ticked tasks land here." : "Nothing here.") + "</li>";
      items.forEach(function (t) {
        var done = t.sec === "done";
        h += '<li class="task' + (done ? " done" : "") + (openId === t.id ? " open" : "") + '">';
        h += '<div class="task-main"><button class="check" data-check="' + t.id + '" aria-label="' + (done ? "Mark not done" : "Mark done") + '">✓</button>';
        h += '<button class="task-text" data-open="' + t.id + '">' + esc(t.text) + (t.tag ? '<span class="tag">' + esc(t.tag) + "</span>" : "") +
             (done && t.doneAt ? '<span class="when">Done ' + fmtDate(t.doneAt) + "</span>" : "") + "</button></div>";
        h += '<div class="actions">';
        if (!done) SECS.slice(0, 3).forEach(function (m) { if (m.key !== t.sec) h += '<button class="chip" data-move="' + t.id + '" data-to="' + m.key + '">Move to ' + m.label + "</button>"; });
        h += '<button class="chip danger" data-del="' + t.id + '">Delete</button></div></li>';
      });
      h += "</ul>";
      if (s.key === "done" && items.length && !isCol) h += '<button class="btn clear" data-clear="1">Clear done</button>';
      h += "</section>";
    });
    root.innerHTML = h;
  }

  function setStatus(msg, warn) {
    statusMsg = msg; statusWarn = !!warn;
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; el.className = "status" + (warn ? " warn" : ""); }
  }

  function buildDoc() {
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var head = '\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Praveen\'s Tasks<\/title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">';
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app").textContent;
    return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>" + head.replace(/\s+$/, "") + "\n<style id=\"css\">" + css + "</style>\n</head>\n<body>\n<div class=\"wrap\" id=\"root\"></div>\n" +
      "<script id=\"state\" type=\"application/json\">" + json + "<\/script>\n<script id=\"app\">" + js + "<\/script>\n</body>\n</html>\n";
  }

  function changed() {
    render();
    if (canSave === false) return;
    setStatus("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 1200);
  }

  function save() {
    if (!artifact) { setStatus("Not connected — changes will be lost when you leave.", true); return; }
    artifact.publish(buildDoc()).then(function () { setStatus("Saved"); }).catch(function (e) {
      var code = (e && (e.code || e.message)) || "";
      if (/conflict/i.test(code)) return;
      if (/not_granted|not_writer/i.test(code)) { canSave = false; setStatus("View only — you can't edit this list.", true); return; }
      setStatus("Couldn't save. Try again in a moment.", true);
    });
  }

  root.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.addsec) { addSec = d.addsec; render(); var i = document.getElementById("addInput"); if (i) i.focus(); return; }
    if (d.toggle) { collapsed[d.toggle] = !collapsed[d.toggle]; saveCollapsed(); render(); return; }
    if (d.open) { openId = openId === d.open ? null : d.open; render(); return; }
    if (d.check) {
      var t = find(d.check); if (!t) return;
      if (t.sec === "done") { t.sec = t.from || "now"; delete t.from; delete t.doneAt; }
      else { t.from = t.sec; t.sec = "done"; t.doneAt = today(); }
      openId = null; changed(); return;
    }
    if (d.move) { var m = find(d.move); if (m) { m.sec = d.to; openId = null; changed(); } return; }
    if (d.del) { state.tasks = state.tasks.filter(function (x) { return x.id !== d.del; }); openId = null; changed(); return; }
    if (d.clear) { state.tasks = state.tasks.filter(function (x) { return x.sec !== "done"; }); changed(); return; }
  });

  root.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = document.getElementById("addInput");
    var text = (input.value || "").trim(); if (!text) return;
    state.tasks.unshift({ id: "t" + (state.nextId++), text: text, sec: addSec });
    if (collapsed[addSec]) { collapsed[addSec] = false; saveCollapsed(); }
    changed();
    var again = document.getElementById("addInput"); if (again) again.focus();
  });

  render();

  var tries = 0;
  (function connect() {
    if (!(window.claude && window.claude.use)) {
      if (++tries < 40) return setTimeout(connect, 250);
      canSave = false; setStatus("Open this in Claude to save changes.", true); return;
    }
    window.claude.use("artifact").then(function (a) {
      artifact = a;
      if (a) { canSave = true; setStatus("Synced · changes save automatically"); }
      else { canSave = false; setStatus("Saving isn't available in this view.", true); }
    }).catch(function () { canSave = false; setStatus("Saving isn't available in this view.", true); });
  })();
})();
</script>
</body>
</html>
