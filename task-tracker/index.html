<style id="css">
/* True-black theme. One thumb-width column: header + filter, sticky quick-add, inbox suggestions, then Now / Next / Later / Done. */
:root {
  --bg: #000000;
  --surface: #0b0b0e;
  --surface-2: #15151b;
  --ink: #f1f1f5;
  --muted: #7d7d8c;
  --line: #22222a;
  --accent: #ffb23f;
  --accent-ink: #1a1000;
  --now: #ffb23f;
  --next: #6ea8ff;
  --later: #b49cff;
  --done: #44d68a;
  --inbox: #3fd9d0;
  --danger: #ff6b6b;
  --font-display: "Unbounded", system-ui, sans-serif;
  --font-body: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  --font-mono: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16.5px; line-height: 1.4; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 120px; display: flex; flex-direction: column; gap: 20px; }
a { color: inherit; }

/* Header */
header { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.date { color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; margin: 4px 0 0; letter-spacing: -0.02em; line-height: 1; }
h1 span { color: var(--accent); }
.kudos { font-family: var(--font-mono); font-size: 12px; color: var(--done); margin-top: 8px; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.sync .led { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok .led { background: var(--done); box-shadow: 0 0 8px var(--done); }
.sync.busy .led { background: var(--accent); animation: pulse 1s infinite; }
.sync.warn { color: var(--danger); border-color: rgba(255,107,107,.4); }
.sync.warn .led { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }
.scan { font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--inbox) 45%, transparent); background: color-mix(in srgb, var(--inbox) 10%, transparent); color: var(--inbox); cursor: pointer; white-space: nowrap; }
.scan svg { width: 15px; height: 15px; }
.scan[disabled] { opacity: .6; cursor: progress; }
.scan.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Filter */
.filter { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.filter button { flex: 1; font: inherit; font-family: var(--font-display); font-size: 12px; font-weight: 500; letter-spacing: .02em; padding: 9px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.filter button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.filter button small { font-family: var(--font-mono); font-size: 11px; opacity: .7; margin-left: 4px; }

/* Quick add */
.add { position: sticky; top: 8px; z-index: 5; background: rgba(11,11,14,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
.add-row { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #000; color: var(--ink); }
.add input::placeholder { color: var(--muted); }
.add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,178,63,.18); }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer; min-height: 46px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.btn-primary:active { transform: scale(.97); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 2px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--c); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sections */
section { display: flex; flex-direction: column; gap: 8px; }
.sec-head { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.pill { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); padding: 5px 11px; border-radius: 999px; }
.sec-head .hint { color: var(--muted); font-size: 13px; }
.sec-head .count { margin-left: auto; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.sec-head .caret { color: var(--muted); width: 14px; height: 14px; flex: none; transition: transform .2s; }
section.collapsed .caret { transform: rotate(-90deg); }
section.collapsed .list { display: none; }
.list { list-style: none; margin: 0; padding: 4px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: inset 3px 0 0 var(--c); }
.empty { padding: 16px; color: var(--muted); font-size: 14px; }

.task { transition: opacity .3s, transform .3s; }
.task.leaving { opacity: 0; transform: translateX(24px); }
.task-main { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px 11px 16px; }
.check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 70%, var(--muted)); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; transition: background .2s, border-color .2s, transform .15s; }
.check svg { width: 14px; height: 14px; }
.check:active { transform: scale(.88); }
.task.done .check, .task.ticking .check { background: var(--done); border-color: var(--done); color: #03140a; }
.task-text { flex: 1; min-width: 0; background: none; border: 0; padding: 3px 0 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.task.done .task-text, .task.ticking .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
.tag.work { color: #ffcf85; border-color: rgba(255,178,63,.25); }
.when { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
.task.open { background: var(--surface-2); }
.actions { display: none; gap: 6px; flex-wrap: wrap; padding: 0 14px 12px 54px; }
.task.open .actions { display: flex; }
.chip.danger { color: var(--danger); border-color: rgba(255,107,107,.35); }
.edit { display: none; gap: 8px; padding: 0 14px 12px 54px; }
.task.editing .edit { display: flex; }
.task.editing .actions { display: none; }
.edit input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--accent); background: #000; color: var(--ink); }
.edit .btn { min-height: 40px; padding: 0 14px; }
.clear { align-self: flex-end; font-size: 13px; min-height: 34px; padding: 0 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* Inbox suggestions */
.inbox .list { box-shadow: inset 3px 0 0 var(--inbox); }
.inbox-note { padding: 12px 16px; font-size: 14px; color: var(--muted); }
.inbox-note.warn { color: var(--danger); }
.sugg { padding: 12px 14px 12px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sugg:first-child { border-top: 0; }
.sugg-text { font-weight: 500; }
.sugg-src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sugg-src a { color: var(--inbox); text-decoration: none; }
.sugg .seg { gap: 6px; }
.inbox-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }

/* Drag */
.grip { flex: none; width: 34px; height: 34px; margin: -4px -8px -4px 0; display: grid; place-items: center; background: none; border: 0; color: var(--muted); opacity: .55; cursor: grab; touch-action: none; padding: 0; }
.grip svg { width: 16px; height: 16px; }
.grip:active { cursor: grabbing; opacity: 1; }
.ghost { position: fixed; z-index: 30; pointer-events: none; list-style: none; background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--c) 60%, var(--line)); border-radius: 12px; box-shadow: 0 16px 36px rgba(0,0,0,.8); transform: scale(1.02); }
.ghost .actions, .ghost .edit { display: none !important; }
.placeholder { list-style: none; margin: 4px 12px; border: 2px dashed color-mix(in srgb, var(--c) 70%, transparent); border-radius: 12px; background: color-mix(in srgb, var(--c) 8%, transparent); }
.sec-head.drop { background: color-mix(in srgb, var(--c) 14%, transparent); border-radius: 10px; }
body.dragging { -webkit-user-select: none; user-select: none; }
body.dragging .add, body.dragging .toast { pointer-events: none; }

/* Undo toast */
.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 160%); width: min(520px, calc(100% - 32px)); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.8); transition: transform .25s ease; z-index: 20; font-size: 14px; }
.toast.show { transform: translate(-50%, 0); }
.toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { font: inherit; font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 8px 10px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  var scanning = false, scanNote = null, scanWarn = false;

  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var collapsed = lsGet("tasks-collapsed", { done: true });
  var filter = lsGet("tasks-filter", "all");
  function saveCollapsed() { lsSet("tasks-collapsed", collapsed); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function weekAgo() { var d = new Date(); d.setDate(d.getDate() - 6); return ymd(d); }
  function fmtDate(iso) { if (!iso) return ""; return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function ago(iso) {
    if (!iso) return "never";
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "just now"; if (m < 60) return m + " min ago";

  }
  function find(id) { for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i]; return null; }
  function snapshot() { return JSON.stringify(state); }
  function isWork(t) { return t.tag === "Work"; }
  function visible(t) { return filter === "all" || (filter === "work" ? isWork(t) : !isWork(t)); }
  function safeUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : ""; }

  function render() {
    var counts = { now: 0, next: 0, later: 0, done: 0 }, open = { all: 0, work: 0, personal: 0 };
    state.tasks.forEach(function (t) {
      if (visible(t)) counts[t.sec] = (counts[t.sec] || 0) + 1;
      if (t.sec !== "done") { open.all++; if (isWork(t)) open.work++; else open.personal++; }
    });
    var since = weekAgo();
    var doneWeek = state.tasks.filter(function (t) { return t.sec === "done" && t.doneAt && t.doneAt >= since && visible(t); }).length;
    var dateStr = new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

    var h = "<header>";
    h += '<div class="top"><div><div class="date">' + esc(dateStr) + '</div><h1>Tasks<span>.</span></h1>' +
         (doneWeek ? '<div class="kudos">' + doneWeek + " done this week</div>" : "") + "</div>" +
         '<div class="top-right"><span class="sync ' + sync.cls + '" id="sync"><span class="led"></span><span id="syncText">' + esc(sync.text) + "</span></span>" +
         '<button class="scan' + (scanning ? " spin" : "") + '" data-scan="1"' + (scanning ? " disabled" : "") + ">" + (scanning ? SPIN + "Scanning…" : MAIL + "Scan inbox") + "</button></div></div>";
    h += '<div class="filter" role="group" aria-label="Show">';
    [["all", "All"], ["personal", "Personal"], ["work", "Work"]].forEach(function (f) {
      h += '<button type="button" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + "<small>" + open[f[0]] + "</small></button>";
    });
    h += "</div></header>";

    h += '<form class="add" id="addForm" autocomplete="off"><div class="add-row">' +
         '<input id="addInput" type="text" placeholder="' + (filter === "work" ? "Add a work task…" : "Add a task…") + '" aria-label="New task" enterkeyhint="done">' +
         '<button class="btn btn-primary" type="submit">Add</button></div><div class="seg" role="group" aria-label="Add to"><span class="seg-label">to</span>';
    SECS.slice(0, 3).forEach(function (s) {
      h += '<button type="button" class="chip" style="--c:' + s.c + '" data-addsec="' + s.key + '" aria-pressed="' + (addSec === s.key) + '"><span class="d"></span>' + s.label + "</button>";
    });
    h += "</div></form>";

    h += inboxHtml();

    SECS.forEach(function (s) {
      var items = state.tasks.filter(function (t) { return t.sec === s.key && visible(t); });
      var isCol = !!collapsed[s.key];
      h += '<section data-sec="' + s.key + '" style="--c:' + s.c + '" class="' + (isCol ? "collapsed" : "") + '">';
      h += '<button class="sec-head" data-toggle="' + s.key + '" aria-expanded="' + !isCol + '">' + CARET + '<span class="pill">' + s.label + "</span>" +
           (s.hint ? '<span class="hint">' + s.hint + "</span>" : "") + '<span class="count">' + items.length + "</span></button>";
      h += '<ul class="list">';
      if (!items.length) h += '<li class="empty">' + (s.key === "done" ? "Ticked tasks land here." : "Nothing here. Nice.") + "</li>";
      if (s.key === "done") items.sort(function (a, b) { return (b.doneAt || "").localeCompare(a.doneAt || ""); });
      items.forEach(function (t) { h += taskHtml(t); });
      h += "</ul>";
      if (s.key === "done" && items.length && !isCol) h += '<button class="btn clear" data-clear="1">Clear done</button>';
      h += "</section>";
    });
    root.innerHTML = h;
    if (editId) { var ei = document.getElementById("edit-" + editId); if (ei) { ei.focus(); ei.setSelectionRange(ei.value.length, ei.value.length); } }
  }

  function inboxHtml() {
    var items = state.inbox.items || [];
    if (!items.length && !scanNote) return "";
    var h = '<section class="inbox" style="--c:var(--inbox)"><div class="sec-head" style="cursor:default"><span class="pill">From inbox</span><span class="hint">email &amp; Teams</span><span class="count">' + items.length + "</span></div>";
    h += '<ul class="list">';
    if (scanNote) h += '<li class="inbox-note' + (scanWarn ? " warn" : "") + '">' + esc(scanNote) + "</li>";
    items.forEach(function (s) {
      var url = safeUrl(s.link);
      h += '<li class="sugg"><div class="sugg-text">' + esc(s.text) + "</div>" +
           '<div class="sugg-src"><span>' + esc(s.source) + (s.from ? " · " + esc(s.from) : "") + "</span>" +
           (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">Open ↗</a>' : "") + "</div>" +
           '<div class="seg"><button class="chip" style="--c:var(--now)" data-take="' + s.id + '" data-to="now"><span class="d"></span>Add to Now</button>' +
           '<button class="chip" style="--c:var(--next)" data-take="' + s.id + '" data-to="next"><span class="d"></span>Next</button>' +

    h += "</ul>";
    h += '<div class="inbox-foot"><span>Checked ' + esc(ago(state.inbox.lastScan)) + "</span>" + (items.length ? '<button class="linkbtn" data-skipall="1">Dismiss all</button>' : "") + "</div></section>";
    return h;
  }

  function taskHtml(t) {
    var done = t.sec === "done";
    var cls = "task" + (done ? " done" : "") + (openId === t.id ? " open" : "") + (editId === t.id ? " editing" : "");
    var h = '<li class="' + cls + '" data-id="' + t.id + '">';
    h += '<div class="task-main"><button class="check" data-check="' + t.id + '" aria-label="' + (done ? "Mark not done: " : "Mark done: ") + esc(t.text) + '">' + CHECK + "</button>";
    h += '<button class="task-text" data-open="' + t.id + '" aria-expanded="' + (openId === t.id) + '">' + esc(t.text) +
         (t.tag ? '<span class="tag' + (isWork(t) ? " work" : "") + '">' + esc(t.tag) + "</span>" : "") +
         (done && t.doneAt ? '<span class="when">Done ' + fmtDate(t.doneAt) + "</span>" : "") + "</button>" +
         '<button class="grip" type="button" data-grip="' + t.id + '" aria-label="Drag to reorder">' + GRIP + "</button></div>";
    h += '<div class="actions">';

    h += '<button class="chip" data-worktoggle="' + t.id + '">' + (isWork(t) ? "Mark personal" : "Mark work") + "</button>";
    h += '<button class="chip" data-edit="' + t.id + '">Edit</button><button class="chip danger" data-del="' + t.id + '">Delete</button></div>';
    h += '<form class="edit" data-editform="' + t.id + '"><input id="edit-' + t.id + '" aria-label="Edit task" value="' + esc(t.text) + '" enterkeyhint="done"><button class="btn btn-primary" type="submit">Save</button></form>';

  }

  function setSync(cls, text) {

  }

  function buildDoc() {
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var head = '\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Praveen\'s Tasks<\/title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">';
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app").textContent;

      '<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>\n' +

  function changed() {

  }

  function save() {

  /* ---------- Inbox scan: Outlook + Teams via the viewer's Microsoft 365 connector, Claude picks the action items ---------- */
  function blocks(res) {

    });

  }
  function mcpMessage(e) {
    var c = e && e.code;
    if (c === "needs_reauth") return "Microsoft 365 needs reconnecting: claude.ai → Settings → Connectors.";
    if (c === "server_not_connected" || c === "server_not_found") return "Add the Microsoft 365 connector in claude.ai → Settings → Connectors.";
    if (c === "selection_required") return "Choose which Microsoft 365 connector this page should use, then scan again.";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "This page needs your OK to read Microsoft 365. Tap Scan inbox and allow it.";
    if (c === "blocked_by_policy") return "Your organization blocks this Microsoft 365 tool here.";
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Scanning only works when you open this page in Claude (not a public link).";
    if (c === "server_unavailable" || c === "rate_limited") return "Microsoft 365 didn't answer. Try again in a minute.";

  }
  function call(mcp, tool, input) {

      if (e && e.retryable) return new Promise(function (r) { setTimeout(r, (e.retryAfterMs || 1500) + Math.random() * 800); })
        .then(function () { return mcp.callTool(M365, tool, input, { cache: false }); });
      throw e;
    });
  }

  function scan() {
    if (scanning) return;
    scanning = true; scanNote = "Reading your email and Teams…"; scanWarn = false; render();
    var started = new Date().toISOString();
    var since = state.inbox.lastScan || new Date(Date.now() - 3 * 86400000).toISOString();
    var mcp, sample;
    var use = window.claude && window.claude.use;
    (use ? Promise.all([use("mcp"), use("sample")]) : Promise.reject({ code: "not_granted" })).then(function (r) {
      mcp = r[0]; sample = r[1];
      if (!mcp || !sample) throw { code: "not_granted" };
      return Promise.allSettled([
        call(mcp, "outlook_email_search", { query: "*", afterDateTime: since, limit: 25 }),
        call(mcp, "chat_message_search", { query: "*", afterDateTime: since, limit: 25 })
      ]);
    }).then(function (res) {
      var msgs = [], fails = [];
      if (res[0].status === "fulfilled") blocks(res[0].value).forEach(function (m) {
        msgs.push({ source: "Email", from: m.senderName || m.sender || "", subject: m.subject || "", text: m.summary || "", link: m.webLink || "", at: m.receivedDateTime || "" });
      }); else fails.push(res[0].reason);
      if (res[1].status === "fulfilled") blocks(res[1].value).forEach(function (m) {
        msgs.push({ source: "Teams", from: (m.from && m.from.displayName) || "", subject: m.subject || "", text: m.summary || "", link: m.webUrl || "", at: m.createdDateTime || "" });
      }); else fails.push(res[1].reason);
      if (fails.length === 2) throw fails[0];
      var partial = fails.length ? " (" + (res[0].status !== "fulfilled" ? "email" : "Teams") + " couldn't be read: " + mcpMessage(fails[0]) + ")" : "";
      if (!msgs.length) return { found: [], msgs: msgs, partial: partial };
      var existing = state.tasks.filter(function (t) { return t.sec !== "done"; }).map(function (t) { return "- " + t.text; })
        .concat((state.inbox.items || []).map(function (s) { return "- " + s.text; })).join("\n");
      var list = msgs.map(function (m, i) { return "[" + i + "] " + m.source + " from " + (m.from || "unknown") + (m.subject ? " | subject: " + m.subject : "") + " | " + m.text.replace(/\s+/g, " ").slice(0, 400); }).join("\n");
      var prompt = "You help Praveen Raamanaathan (Senior Associate at ZoomRx, a pharma market-research company) keep his to-do list.\n" +
        "Below are his recent work emails and Microsoft Teams messages. Pick out ONLY concrete action items that Praveen himself needs to do: direct requests to him, reminders of things pending on him, deadlines, follow-ups he owes.\n" +
        "Ignore: newsletters, marketing, webinars, automated birthday/holiday greetings, general FYIs, messages that need nothing from him, and anything already on his list below.\n" +
        "Merge duplicates (e.g. repeated reminders about the same thing) into one item.\n\n" +
        "His current list:\n" + (existing || "(empty)") + "\n\nMessages:\n" + list + "\n\n" +
        'Reply with JSON only: an array (at most 8) of {"text": short imperative task, max 70 characters, "ref": index of the main source message}. Reply [] if there are none.';
      return sample.json(prompt).catch(function (e) { throw { sample: true, code: e && e.code, message: e && e.message }; }).then(function (v) { return { found: Array.isArray(v) ? v : (v && v.items) || [], msgs: msgs, partial: partial }; });
    }).then(function (r) {
      var n = 0;
      r.found.forEach(function (f) {
        if (!f || !f.text) return;
        var m = r.msgs[f.ref] || {};
        state.inbox.items.push({ id: "s" + (state.nextId++), text: String(f.text).slice(0, 120), source: m.source || "Inbox", from: m.from || "", link: m.link || "" });
        n++;
      });
      state.inbox.lastScan = started;
      scanNote = (n ? n + " new action item" + (n === 1 ? "" : "s") + " found." : "Nothing new that needs you.") + r.partial;
      scanWarn = !!r.partial; scanning = false;
      changed();
    }).catch(function (e) {
      scanning = false; scanWarn = true;
      scanNote = e && e.sample
        ? (e.code === "rate_limited" ? "Claude is busy right now. Try again in a few minutes." : e.code === "not_granted" ? "This page needs your OK to ask Claude. Tap Scan inbox and allow it." : "Claude couldn't sort the messages" + (e.message ? ": " + e.message : "."))
        : mcpMessage(e);
      render();
    });
  }

  document.getElementById("toastUndo").addEventListener("click", function () {
    if (!undoSnap) return;
    state = JSON.parse(undoSnap); undoSnap = null;
    document.getElementById("toast").classList.remove("show");
    openId = null; editId = null; changed();
  });

  root.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.scan) { scan(); return; }
    if (d.filter) { filter = d.filter; lsSet("tasks-filter", filter); openId = null; render(); return; }
    if (d.addsec) { addSec = d.addsec; render(); return; }
    if (d.toggle) { collapsed[d.toggle] = !collapsed[d.toggle]; saveCollapsed(); render(); return; }
    if (d.open) { openId = openId === d.open ? null : d.open; editId = null; render(); return; }
    if (d.edit) { editId = d.edit; render(); return; }
    if (d.worktoggle) { var w = find(d.worktoggle); if (w) { w.tag = isWork(w) ? "Personal" : "Work"; openId = null; changed(); } return; }
    if (d.take) {
      var snapT = snapshot(), s = null;
      state.inbox.items = state.inbox.items.filter(function (x) { if (x.id === d.take) { s = x; return false; } return true; });
      if (s) { state.tasks.unshift({ id: s.id.replace(/^s/, "t"), text: s.text, sec: d.to, tag: "Work" }); showToast("Added to " + (d.to === "now" ? "Now" : "Next") + ": " + s.text, snapT); }
      if (!state.inbox.items.length) scanNote = null;
      changed(); return;
    }
    if (d.skip) { state.inbox.items = state.inbox.items.filter(function (x) { return x.id !== d.skip; }); if (!state.inbox.items.length) scanNote = null; changed(); return; }
    if (d.skipall) { var snapS = snapshot(); state.inbox.items = []; scanNote = null; showToast("Dismissed inbox suggestions", snapS); changed(); return; }
    if (d.check) {
      var t = find(d.check); if (!t) return;
      var snap = snapshot();
      if (t.sec === "done") {
        t.sec = t.from || "now"; delete t.from; delete t.doneAt; openId = null;
        showToast("Moved back to " + t.sec.charAt(0).toUpperCase() + t.sec.slice(1), snap); changed(); return;
      }
      var li = b.closest(".task"); li.classList.add("ticking");
      setTimeout(function () { li.classList.add("leaving"); }, 220);
      setTimeout(function () {
        t.from = t.sec; t.sec = "done"; t.doneAt = today(); openId = null; editId = null;
        showToast("Done: " + t.text, snap); changed();
      }, 520);
      return;
    }
    if (d.move) { var m = find(d.move); if (m) { m.sec = d.to; openId = null; changed(); } return; }
    if (d.del) {
      var snapD = snapshot(), del = find(d.del);
      state.tasks = state.tasks.filter(function (x) { return x.id !== d.del; }); openId = null;
      showToast("Deleted: " + (del ? del.text : "task"), snapD); changed(); return;
    }
    if (d.clear) {
      var snapC = snapshot(), gone = state.tasks.filter(function (x) { return x.sec === "done" && visible(x); }).length;
      state.tasks = state.tasks.filter(function (x) { return !(x.sec === "done" && visible(x)); });
      showToast("Cleared " + gone + " done task" + (gone === 1 ? "" : "s"), snapC); changed(); return;
    }
  });

  root.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.dataset && f.dataset.editform) {
      var t = find(f.dataset.editform), v = (f.querySelector("input").value || "").trim();
      if (t && v) t.text = v;
      editId = null; openId = null; changed(); return;
    }
    var input = document.getElementById("addInput");
    var text = (input.value || "").trim(); if (!text) return;
    var task = { id: "t" + (state.nextId++), text: text, sec: addSec };
    if (filter === "work") task.tag = "Work"; else if (filter === "personal") task.tag = "Personal";
    state.tasks.unshift(task);
    if (collapsed[addSec]) { collapsed[addSec] = false; saveCollapsed(); }
    changed();
    var again = document.getElementById("addInput"); if (again) again.focus();
  });

  /* Drag to reorder: grab the dotted handle, drop anywhere in Now / Next / Later / Done (or on a collapsed section's header). */
  var drag = null;
  root.addEventListener("pointerdown", function (ev) {
    var g = ev.target.closest(".grip"); if (!g || drag) return;
    ev.preventDefault();
    var li = g.closest(".task"), r = li.getBoundingClientRect();
    var ghost = li.cloneNode(true);
    ghost.className = "task ghost" + (li.classList.contains("done") ? " done" : "");
    ghost.style.cssText = "width:" + r.width + "px;left:" + r.left + "px;top:" + r.top + "px;--c:" + getComputedStyle(li.closest("section")).getPropertyValue("--c");
    document.body.appendChild(ghost);
    var ph = document.createElement("li"); ph.className = "placeholder"; ph.style.height = (li.querySelector(".task-main").offsetHeight - 8) + "px";
    li.parentNode.insertBefore(ph, li); li.style.display = "none";
    drag = { id: li.dataset.id, li: li, ghost: ghost, ph: ph, dy: ev.clientY - r.top, x: ev.clientX, y: ev.clientY, y0: ev.clientY, moved: false, head: null };
    document.body.classList.add("dragging");
    try { g.setPointerCapture(ev.pointerId); } catch (e) {}
    requestAnimationFrame(autoScroll);
  });
  function setHead(h) {
    if (drag.head && drag.head !== h) drag.head.classList.remove("drop");
    drag.head = h; if (h) h.classList.add("drop");
    drag.ph.style.display = h ? "none" : "";
  }
  function dragTo(x, y) {
    drag.ghost.style.top = (y - drag.dy) + "px";
    var el = document.elementFromPoint(x, y); if (!el) return;
    var head = el.closest(".sec-head");
    if (head) {
      var sec = head.closest("section");
      if (sec.classList.contains("collapsed")) { setHead(head); return; }
      setHead(null); var l = sec.querySelector(".list"); l.insertBefore(drag.ph, l.firstChild); return;
    }
    var t = el.closest(".task, .empty");
    if (!t || t === drag.ph || t.classList.contains("ghost")) return;
    setHead(null);
    if (t.classList.contains("empty")) { t.parentNode.insertBefore(drag.ph, t); return; }
    var rr = t.getBoundingClientRect();
    t.parentNode.insertBefore(drag.ph, y < rr.top + rr.height / 2 ? t : t.nextSibling);
  }
  function autoScroll() {
    if (!drag) return;
    if (!drag.moved) { requestAnimationFrame(autoScroll); return; }
    var m = 80, v = 0, H = window.innerHeight;
    if (drag.y < m) v = -(m - drag.y) / 4; else if (drag.y > H - m) v = (drag.y - (H - m)) / 4;
    if (v) { window.scrollBy(0, v); dragTo(drag.x, drag.y); }
    requestAnimationFrame(autoScroll);
  }
  document.addEventListener("pointermove", function (ev) {
    if (!drag) return; ev.preventDefault();
    drag.x = ev.clientX; drag.y = ev.clientY; if (Math.abs(drag.y - drag.y0) > 8) drag.moved = true; dragTo(ev.clientX, ev.clientY);
  }, { passive: false });
  function endDrag(cancel) {
    var d = drag; drag = null;
    document.body.classList.remove("dragging"); d.ghost.remove();
    var sec = null, beforeId = null, atTop = false;
    if (d.head) { sec = d.head.closest("section").dataset.sec; atTop = true; }
    else {
      var s = d.ph.closest("section"); sec = s && s.dataset.sec;
      var n = d.ph.nextElementSibling;
      while (n && (!n.dataset.id || n === d.li)) n = n.nextElementSibling;
      beforeId = n ? n.dataset.id : null;
    }
    var t = find(d.id);
    if (cancel || !sec || !t) { render(); return; }
    var before = snapshot(), prev = t.sec;
    state.tasks = state.tasks.filter(function (x) { return x !== t; });
    if (sec === "done" && prev !== "done") { t.from = prev; t.doneAt = today(); }
    if (sec !== "done" && prev === "done") { delete t.from; delete t.doneAt; }
    t.sec = sec;
    var idx = -1, i;
    if (beforeId) { for (i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === beforeId) { idx = i; break; } }
    else if (atTop) { for (i = 0; i < state.tasks.length; i++) if (state.tasks[i].sec === sec) { idx = i; break; } }
    else { for (i = state.tasks.length - 1; i >= 0; i--) if (state.tasks[i].sec === sec) { idx = i + 1; break; } }
    if (idx < 0) state.tasks.push(t); else state.tasks.splice(idx, 0, t);
    openId = null; editId = null;
    if (snapshot() === before) { render(); return; }
    if (sec !== prev) showToast("Moved to " + sec.charAt(0).toUpperCase() + sec.slice(1) + ": " + t.text, before);
    changed();
  }
  document.addEventListener("pointerup", function () { if (drag) endDrag(false); });
  document.addEventListener("pointercancel", function () { if (drag) endDrag(true); });


  render();

  var tries = 0;
  (function connect() {
    if (!(window.claude && window.claude.use)) {
      if (++tries < 40) return setTimeout(connect, 250);
      canSave = false; setSync("warn", "Open in Claude to save"); return;
    }
    window.claude.use("artifact").then(function (a) {
      artifact = a;
      if (a) { canSave = true; setSync("ok", "Synced"); }
      else { canSave = false; setSync("warn", "View only"); }
    }).catch(function () { canSave = false; setSync("warn", "View only"); });
  })();
})();
</script>
