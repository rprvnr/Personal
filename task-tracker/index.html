* { box-sizing: border-box; }

/* Header */

.add { position: relative; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }

.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--c); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sections */
section { display: flex; flex-direction: column; gap: 4px; }
.sec-head { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 2px 2px; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.pill { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); padding: 3px 8px; border-radius: 999px; }
.sec-head .hint { color: var(--muted); font-size: 12px; }
.sec-head .count { margin-left: auto; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.sec-head .caret { color: var(--muted); width: 14px; height: 14px; flex: none; transition: transform .2s; }
section.collapsed .caret { transform: rotate(-90deg); }
section.collapsed .list { display: none; }
.list { list-style: none; margin: 0; padding: 2px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: inset 3px 0 0 var(--c); }

/* Swipe: right = done, left = tomorrow */
.task.swiping { background: var(--bg); }
.task.swiping .task-main, .task.swipe-back .task-main { position: relative; z-index: 1; background: var(--surface); }
.task.swipe-back .task-main { transition: transform .2s ease; }
.task.swiping::before { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 18px; font-size: 13px; font-weight: 700; letter-spacing: .02em; opacity: var(--p, 0); }
.task.sw-r::before { content: "\2713  Done"; justify-content: flex-start; color: #03140a; background: var(--done); }
.task.sw-l::before { content: "Tomorrow \2192"; justify-content: flex-end; color: #1d1405; background: var(--next); }
.task.sw-armed::before { opacity: 1; }
/* Tick celebration */
.task.ticking .check { animation: pop .32s ease; }
@keyframes pop { 40% { transform: scale(1.3); } }
.spark { position: fixed; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; pointer-events: none; z-index: 30; animation: spark .6s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
.qa-hint { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 2px; }
.qa-hint:empty { display: none; }
.qa-hint em { font-style: normal; align-self: center; }
.qa-hint span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--ink); }
.task-main { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; display: flex; align-items: flex-start; gap: 10px; padding: 7px 12px 7px 14px; }
.check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 70%, var(--muted)); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; transition: background .2s, border-color .2s, transform .15s; }
.check svg { width: 12px; height: 12px; }
.check:active { transform: scale(.88); }
.task.done .check, .task.ticking .check { background: var(--done); border-color: var(--done); color: #03140a; }
.task-text { flex: 1; min-width: 0; background: none; border: 0; padding: 1px 0 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.task.done .task-text, .task.ticking .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
.tag { color: var(--tc, var(--muted)); border-color: color-mix(in srgb, var(--tc, var(--line)) 35%, transparent); }
.when { display: inline-block; width: 100%; font-family: var(--font-mono); font-size: 11px; color: var(--done); opacity: .8; margin-top: 3px; text-decoration: none; }
.task.open { background: var(--surface-2); }
.actions { display: none; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px 46px; }
.task.open .actions { display: flex; }
.chip.danger { color: var(--danger); border-color: rgba(255,107,107,.35); }
.edit { display: none; gap: 8px; padding: 0 12px 10px 46px; }
.task.editing .edit { display: flex; }
.task .edit { flex-wrap: wrap; }
.task .edit input[type="text"], .task .edit > input:first-child { flex: 1 1 100%; }
.edit .opts { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; }
.edit input[type="date"], .edit select { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); color-scheme: dark; }
.meta { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; margin-left: 8px; vertical-align: 1px; color: var(--muted); white-space: nowrap; }
.meta.due-today { color: var(--now); }
.meta.overdue { color: var(--danger); }
.meta.stuck { color: #ffb86b; opacity: .85; }
.today-done { padding: 11px 14px; font-size: 14px; font-weight: 600; color: var(--done); }
.task.editing .actions { display: none; }
.edit input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--bg); color: var(--ink); }
.edit .btn { min-height: 40px; padding: 0 14px; }
.clear { align-self: flex-end; font-size: 13px; min-height: 34px; padding: 0 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* Inbox suggestions */
.inbox .list { box-shadow: inset 3px 0 0 var(--inbox); }
.inbox-note { padding: 12px 16px; font-size: 14px; color: var(--muted); }
.inbox-note.warn { color: var(--danger); }
.sugg { padding: 9px 12px 9px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sugg:first-child { border-top: 0; }
.sugg-text { font-weight: 500; }
.sugg-src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sugg-src a { color: var(--inbox); text-decoration: none; }
.sugg .seg { gap: 6px; }
.inbox-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }

.daynav button { font: inherit; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; width: 40px; height: 36px; cursor: pointer; font-size: 17px; }
.daynav button[disabled] { opacity: .3; cursor: default; }
.daynav .dlabel { font-weight: 700; font-size: 16px; text-align: center; }
.daynav .dsub { color: var(--muted); font-size: 12px; text-align: center; margin-top: 2px; }

.placeholder { list-style: none; margin: 4px 12px; border: 2px dashed color-mix(in srgb, var(--c) 70%, transparent); border-radius: 12px; background: color-mix(in srgb, var(--c) 8%, transparent); }
.sec-head.drop { background: color-mix(in srgb, var(--c) 14%, transparent); border-radius: 10px; }
body.dragging { -webkit-user-select: none; user-select: none; }
body.dragging .add, body.dragging .toast { pointer-events: none; }

/* Add button (floating, thumb reach) */
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 15; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; font-weight: 400; line-height: 1; cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,.55); display: grid; place-items: center; padding: 0 0 3px; }
.fab:active { transform: scale(.94); }
body.dragging .fab { pointer-events: none; opacity: .3; }
/* One-tap star */
.star { flex: none; width: 30px; height: 30px; margin: -4px -4px -4px 0; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); opacity: .45; }
.star svg { width: 17px; height: 17px; }
.star.on { color: var(--today); opacity: 1; }
.star:active { transform: scale(.85); }

/* Undo toast */
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 260%); width: min(520px, calc(100% - 32px)); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.8); transition: transform .25s ease; z-index: 20; font-size: 14px; }
.toast.show { transform: translate(-50%, 0); }
.toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { font: inherit; font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 8px 10px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  document.addEventListener("pointermove", function (ev) {
    if (press && !drag) { if (Math.abs(ev.clientX - press.x) > 8 || Math.abs(ev.clientY - press.y) > 8) cancelPress(); return; }
    if (!drag) return; ev.preventDefault();
    drag.x = ev.clientX; drag.y = ev.clientY; if (Math.abs(drag.y - drag.y0) > 8) drag.moved = true; dragTo(ev.clientX, ev.clientY);
  }, { passive: false });
  function endDrag(cancel) {
    var d = drag; drag = null;
    document.body.classList.remove("dragging"); d.ghost.remove();
    var sec = null, beforeId = null, atTop = false;
    if (d.head) { sec = d.head.closest("section").dataset.sec; atTop = true; }
    else {
      var s = d.ph.closest("section"); sec = s && s.dataset.sec;
      var n = d.ph.nextElementSibling;
      while (n && (!n.dataset.id || n === d.li)) n = n.nextElementSibling;
      beforeId = n ? n.dataset.id : null;
    }
    var t = find(d.id);
    if (cancel || !sec || !t) { render(); return; }
    var before = snapshot(), prev = t.sec;
    state.tasks = state.tasks.filter(function (x) { return x !== t; });
    if (isDoneSec(sec) && !isDoneSec(prev)) { t.from = prev; t.doneAt = today(); if (sec === "done") spawnRepeat(t); }
    if (!isDoneSec(sec) && isDoneSec(prev)) { delete t.from; delete t.doneAt; }
    t.sec = sec;
    var idx = -1, i;
    if (beforeId) { for (i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === beforeId) { idx = i; break; } }
    else if (atTop) { for (i = 0; i < state.tasks.length; i++) if (state.tasks[i].sec === sec) { idx = i; break; } }
    else { for (i = state.tasks.length - 1; i >= 0; i--) if (state.tasks[i].sec === sec) { idx = i + 1; break; } }
    if (idx < 0) state.tasks.push(t); else state.tasks.splice(idx, 0, t);
    openId = null; editId = null;
    if (snapshot() === before) { render(); return; }
    if (sec !== prev) showToast("Moved to " + (sec === "shop" ? "To buy" : sec.charAt(0).toUpperCase() + sec.slice(1)) + ": " + t.text, before);
    changed();
  }
  document.addEventListener("pointerup", function () { cancelPress(); if (drag) endDrag(false); });
  document.addEventListener("pointercancel", function () { cancelPress(); if (drag) endDrag(true); });

  /* Swipe a row: right = done, left = tomorrow. Vertical moves are left to the page scroll. */
  /* Touch events drive swipes on phones (pointer events get cancelled inside the app's webview); the mouse uses pointer events. */
  var swipe = null;
  function beginSwipe(target, x, y, id) {
    if (drag || swipe) return;
    var main = target.closest && target.closest(".task-main"); if (!main) return;
    if (target.closest(".grip, .check, .star, input, select, textarea")) return;
    var li = main.closest(".task");
    if (!li || li.classList.contains("editing") || li.classList.contains("open") || li.classList.contains("done") || li.classList.contains("ghost")) return;
    var t = find(li.dataset.id); if (!t || isDoneSec(t.sec)) return;
    swipe = { li: li, main: main, t: t, x0: x, y0: y, dx: 0, on: false, pid: id, w: li.offsetWidth, left: t.sec !== "shop" };
  }
  /* Returns true while the gesture is a horizontal swipe (caller then blocks native scrolling). */
  function moveSwipe(x, y) {
    if (!swipe) return false;
    var dx = x - swipe.x0, dy = y - swipe.y0;
    if (!swipe.on) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return false; }
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return false;
      if (dx < 0 && !swipe.left) { swipe = null; return false; }
      swipe.on = true; swipe.li.classList.add("swiping"); swipe.x0 = x - (dx > 0 ? 1 : -1); dx = x - swipe.x0;
    }
    if (dx < 0 && !swipe.left) dx = 0;
    swipe.dx = dx;
    var lim = Math.min(100, swipe.w * .3), p = Math.min(1, Math.abs(dx) / lim);
    swipe.li.classList.toggle("sw-r", dx > 0); swipe.li.classList.toggle("sw-l", dx < 0);
    var armed = Math.abs(dx) >= lim;
    if (armed && !swipe.armed) buzz(8);
    swipe.armed = armed; swipe.li.classList.toggle("sw-armed", armed);
    swipe.li.style.setProperty("--p", (.35 + p * .65).toFixed(2));
    swipe.main.style.transform = "translateX(" + dx + "px)";
    return true;
  }
  function endSwipe(cancel) {
    var s = swipe; swipe = null; if (!s || !s.on) return;
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 400);
    if (!cancel && s.armed) {
      s.main.style.transition = "transform .22s ease"; s.main.style.transform = "translateX(" + (s.dx > 0 ? s.w : -s.w) + "px)";
      if (s.dx > 0) completeTask(s.t, s.li, snapshot(), s.li.querySelector(".check"), true); else snoozeTask(s.t, s.li);
      return;
    }
    s.li.classList.add("swipe-back"); s.main.style.transform = "";
    setTimeout(function () { s.li.classList.remove("swiping", "swipe-back", "sw-r", "sw-l", "sw-armed"); }, 220);
  }
  root.addEventListener("touchstart", function (ev) {
    if (ev.touches.length !== 1) { endSwipe(true); return; }
    var tc = ev.touches[0]; beginSwipe(ev.target, tc.clientX, tc.clientY, "touch");
  }, { passive: true });
  document.addEventListener("touchmove", function (ev) {
    if (!swipe || swipe.pid !== "touch") return;
    var tc = ev.touches[0]; if (!tc) return;
    if (moveSwipe(tc.clientX, tc.clientY) && ev.cancelable) ev.preventDefault();
  }, { passive: false });
  document.addEventListener("touchend", function () { if (swipe && swipe.pid === "touch") endSwipe(false); });
  document.addEventListener("touchcancel", function () { if (swipe && swipe.pid === "touch") endSwipe(swipe.armed ? false : true); });
  root.addEventListener("pointerdown", function (ev) {
    if (ev.pointerType !== "mouse" || ev.button > 0) return;
    beginSwipe(ev.target, ev.clientX, ev.clientY, "mouse");
  });
  document.addEventListener("pointermove", function (ev) {
    if (!swipe || swipe.pid !== "mouse") return;
    if (moveSwipe(ev.clientX, ev.clientY)) { try { swipe.main.setPointerCapture(ev.pointerId); } catch (e) {} }
  });
  document.addEventListener("pointerup", function () { if (swipe && swipe.pid === "mouse") endSwipe(false); });


  render();

  var tries = 0;
  (function connect() {
    if (!(window.claude && window.claude.use)) {
      if (++tries < 40) return setTimeout(connect, 250);
      fallback("Open in Claude to save"); return;
    }
    window.claude.use("db").then(function (db) {
      if (!db) { fallback("View only"); return; }
      dbRef = db.doc("app/state"); canSave = true; setSync("ok", "Synced");
      var timer = setTimeout(function () { if (!loaded) fallback("Can't reach your data yet"); }, 10000);
      dbRef.onSnapshot(function (snap) {
        if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(timer);
        applyRemote(snap);
      }, function (e) { clearTimeout(timer); if (!loaded) fallback("Can't reach your data"); else setSync("warn", "Offline — reopen the page"); });
    }).catch(function () { fallback("View only"); });
  })();
  function fallback(msg) { if (!loaded) { loaded = true; normalize(); render(); } if (!dbRef) canSave = false; setSync("warn", msg); }
})();
</script>
