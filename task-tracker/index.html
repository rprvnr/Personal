<style id="css">
/* True-black theme. One thumb-width column: header + filter, sticky quick-add, inbox suggestions, then Now / Next / Later / Done. */
:root {
  --bg: #000000;
  --surface: #0b0b0e;
  --surface-2: #15151b;
  --ink: #f1f1f5;
  --muted: #7d7d8c;
  --line: #22222a;
  --accent: #ff5c5c;
  --accent-ink: #1f0303;
  --now: #ff5c5c;
  --next: #ffd23f;
  --later: #4cc9f0;
  --done: #3ddc84;
  --inbox: #a78bfa;
  --shop: #f472b6;
  --t-work: #ff9f43;
  --t-personal: #a3e635;
  --t-errands: #60a5fa;
  --t-home: #e879f9;
  --t-goals: #2dd4bf;
  --danger: #ff6b6b;
  --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.35; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 120px; display: flex; flex-direction: column; gap: 14px; }
a { color: inherit; }

/* Header */
header { display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; }
.date { color: var(--muted); font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
h1 span { color: var(--accent); }
.kudos { font-family: var(--font-mono); font-size: 11px; color: var(--done); margin-top: 6px; }
.top-right { display: flex; align-items: center; gap: 10px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync .led { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok .led { background: var(--done); opacity: .7; }
.sync.busy .led { background: var(--muted); animation: pulse 1s infinite; }
.sync.warn { color: var(--danger); }
.sync.warn .led { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }
.scan { font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--inbox) 45%, transparent); background: color-mix(in srgb, var(--inbox) 10%, transparent); color: var(--inbox); cursor: pointer; white-space: nowrap; }
.scan svg { width: 15px; height: 15px; }
.scan[disabled] { opacity: .6; cursor: progress; }
.scan.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Filter */
.filter { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.filter button { flex: 1; font: inherit; font-family: var(--font-display); font-size: 13px; font-weight: 600; padding: 8px 4px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.filter button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.filter button small { font-family: var(--font-mono); font-size: 10px; opacity: .7; margin-left: 4px; }

/* Quick add */
.add-toggle { font: inherit; font-size: 15px; font-weight: 600; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.add-toggle:active { background: var(--surface); }
.x { font: inherit; font-size: 22px; line-height: 1; width: 40px; min-height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; }
.add { position: relative; z-index: 5; background: rgba(11,11,14,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
.add-row { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); background: #000; color: var(--ink); }
.add input::placeholder { color: var(--muted); }
.add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,92,92,.2); }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 0 16px; cursor: pointer; min-height: 40px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.btn-primary:active { transform: scale(.97); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.add .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -8px; padding: 0 8px; }
.add .seg::-webkit-scrollbar { display: none; }
.add .chip { font-size: 11.5px; padding: 4px 9px; flex: none; }
.seg .divider { flex: none; width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.seg-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 2px; }
.chip { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--c); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sections */
section { display: flex; flex-direction: column; gap: 6px; }
.sec-head { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.pill { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); padding: 4px 9px; border-radius: 999px; }
.sec-head .hint { color: var(--muted); font-size: 12px; }
.sec-head .count { margin-left: auto; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.sec-head .caret { color: var(--muted); width: 14px; height: 14px; flex: none; transition: transform .2s; }
section.collapsed .caret { transform: rotate(-90deg); }
section.collapsed .list { display: none; }
.list { list-style: none; margin: 0; padding: 2px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: inset 3px 0 0 var(--c); }
.empty { padding: 12px 14px; color: var(--muted); font-size: 13px; }

.task { transition: opacity .3s, transform .3s; }
.task.leaving { opacity: 0; transform: translateX(24px); }
.task-main { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; display: flex; align-items: flex-start; gap: 10px; padding: 7px 12px 7px 14px; }
.check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 70%, var(--muted)); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; transition: background .2s, border-color .2s, transform .15s; }
.check svg { width: 12px; height: 12px; }
.check:active { transform: scale(.88); }
.task.done .check, .task.ticking .check { background: var(--done); border-color: var(--done); color: #03140a; }
.task-text { flex: 1; min-width: 0; background: none; border: 0; padding: 1px 0 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.task.done .task-text, .task.ticking .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
.tag { color: var(--tc, var(--muted)); border-color: color-mix(in srgb, var(--tc, var(--line)) 35%, transparent); }
.when { display: inline-block; width: 100%; font-family: var(--font-mono); font-size: 11px; color: var(--done); opacity: .8; margin-top: 3px; text-decoration: none; }
.task.open { background: var(--surface-2); }
.actions { display: none; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px 46px; }
.task.open .actions { display: flex; }
.chip.danger { color: var(--danger); border-color: rgba(255,107,107,.35); }
.edit { display: none; gap: 8px; padding: 0 12px 10px 46px; }
.task.editing .edit { display: flex; }
.task.editing .actions { display: none; }
.edit input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--accent); background: #000; color: var(--ink); }
.edit .btn { min-height: 40px; padding: 0 14px; }
.clear { align-self: flex-end; font-size: 13px; min-height: 34px; padding: 0 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* Inbox suggestions */
.inbox .list { box-shadow: inset 3px 0 0 var(--inbox); }
.inbox-note { padding: 12px 16px; font-size: 14px; color: var(--muted); }
.inbox-note.warn { color: var(--danger); }
.sugg { padding: 9px 12px 9px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sugg:first-child { border-top: 0; }
.sugg-text { font-weight: 500; }
.sugg-src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sugg-src a { color: var(--inbox); text-decoration: none; }
.sugg .seg { gap: 6px; }
.inbox-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }

/* Routines */
.today { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.today::-webkit-scrollbar { display: none; }
.today-label { flex: none; align-self: center; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.rchip { flex: none; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.rchip.full { border-color: color-mix(in srgb, var(--done) 55%, transparent); background: color-mix(in srgb, var(--done) 13%, transparent); }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.pip.on { background: var(--done); border-color: var(--done); }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav button { font: inherit; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; width: 40px; height: 36px; cursor: pointer; font-size: 17px; }
.daynav button[disabled] { opacity: .3; cursor: default; }
.daynav .dlabel { font-weight: 700; font-size: 16px; text-align: center; }
.daynav .dsub { color: var(--muted); font-size: 12px; text-align: center; margin-top: 2px; }
.routine { border-top: 1px solid var(--line); }
.routine:first-child { border-top: 0; }
.r-main { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; }
.r-name { flex: 1; min-width: 0; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); text-align: left; cursor: pointer; }
.r-meta { display: flex; gap: 10px; align-items: center; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.week { display: inline-flex; gap: 3px; }
.week i { width: 9px; height: 9px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.week i.half { background: color-mix(in srgb, var(--done) 35%, transparent); border-color: transparent; }
.week i.full { background: var(--done); border-color: var(--done); }
.streak { color: var(--accent); font-weight: 700; }
.r-dots { display: flex; gap: 8px; }
.rdot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--done) 60%, var(--muted)); background: transparent; cursor: pointer; display: grid; place-items: center; color: transparent; padding: 0; transition: background .15s, transform .15s; }
.rdot svg { width: 14px; height: 14px; }
.rdot:active { transform: scale(.88); }
.rdot.on { background: var(--done); border-color: var(--done); color: #03140a; }
.routine.open { background: var(--surface-2); }
.routine .actions { padding: 0 12px 10px 14px; }
.routine.open .actions { display: flex; }
.routine .edit { padding: 0 12px 10px 14px; }
.routine.editing .edit { display: flex; }
.routine.editing .actions { display: none; }
.r-add { display: flex; gap: 8px; }
.r-add input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.r-add input:focus { outline: none; border-color: var(--done); }
.r-add .btn { background: var(--done); color: #03140a; }
.hint-line { font-size: 12px; color: var(--muted); padding: 0 2px; }

/* Drag */
.grip { flex: none; width: 32px; height: 30px; margin: -5px -8px -5px 0; display: grid; place-items: center; background: none; border: 0; color: var(--muted); opacity: .55; cursor: grab; touch-action: none; padding: 0; }
.grip svg { width: 16px; height: 16px; }
.grip:active { cursor: grabbing; opacity: 1; }
.ghost { position: fixed; z-index: 30; pointer-events: none; list-style: none; background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--c) 60%, var(--line)); border-radius: 12px; box-shadow: 0 16px 36px rgba(0,0,0,.8); transform: scale(1.02); }
.ghost .actions, .ghost .edit { display: none !important; }
.placeholder { list-style: none; margin: 4px 12px; border: 2px dashed color-mix(in srgb, var(--c) 70%, transparent); border-radius: 12px; background: color-mix(in srgb, var(--c) 8%, transparent); }
.sec-head.drop { background: color-mix(in srgb, var(--c) 14%, transparent); border-radius: 10px; }
body.dragging { -webkit-user-select: none; user-select: none; }
body.dragging .add, body.dragging .toast { pointer-events: none; }

/* Undo toast */
.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 160%); width: min(520px, calc(100% - 32px)); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.8); transition: transform .25s ease; z-index: 20; font-size: 14px; }
.toast.show { transform: translate(-50%, 0); }
.toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { font: inherit; font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 8px 10px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  /* ---------- Inbox scan: Outlook + Teams via the viewer's Microsoft 365 connector, Claude picks the action items ---------- */

    var p = res && res.payload;

    var msgs = [], next = null;

      return call(mcp, tool, inp).then(function (res) {

  }
  function mcpMessage(e, name) {
    name = (e && e.server) || name || M365;

    if (c === "needs_reauth") return name + " needs reconnecting: claude.ai → Settings → Connectors.";
    if (c === "server_not_connected" || c === "server_not_found") return "Add the " + name + " connector in claude.ai → Settings → Connectors.";
    if (c === "selection_required") return "Choose which " + name + " connector this page should use, then scan again.";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "This page needs your OK to read " + name + ". Tap Scan inbox and allow it.";
    if (c === "blocked_by_policy") return "Your organization blocks this " + name + " tool here.";
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Scanning only works when you open this page in Claude (not a public link).";
    if (c === "server_unavailable" || c === "rate_limited") return name + " didn't answer. Try again in a minute.";

  function call(mcp, tool, input) {

        .then(function () { return mcp.callTool(M365, tool, input, { cache: false }); });

  }

  /* Wispr Flow: recorded meetings (their "Next Steps") and scratchpad notes since the last scan. */
  function flowCall(mcp, tool, input) {
    return mcp.callTool(FLOW, tool, input, { cache: false }).then(function (r) {
      var p = r && r.payload;
      if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = null; } }
      if (!p || typeof p !== "object") { var objs = []; ((r && r.content) || []).forEach(function (b) { if (b && b.type === "text" && b.text) objs = objs.concat(parseMulti(b.text)); }); p = objs[0] || {}; }

  function nextSteps(sum) {

    var out = [];

      flowCall(mcp, "search_meetings", { since: since, limit: 10 }),
      flowCall(mcp, "search_scratchpad_notes", { since: since, limit: 10 })

      if (r[0].status === "rejected" && r[1].status === "rejected") throw r[0].reason;
      var meets = r[0].status === "fulfilled" ? (r[0].value.meetings || []) : [];
      var notes = r[1].status === "fulfilled" ? (r[1].value.notes || []) : [];
      notes.forEach(function (n) { out.push({ source: "Wispr note", from: n.title || "Note", subject: "", text: n.content_excerpt || "", link: "", at: n.modified_at || "" }); });
      return Promise.all(meets.slice(0, 6).map(function (mt) {
        return flowCall(mcp, "get_meeting", { meeting_id: mt.id, view_content: { char_limit: 1 } })
          .then(function (full) { return nextSteps((full && full.summary) || mt.content_excerpt || ""); }, function () { return mt.content_excerpt || ""; })
          .then(function (txt) { out.push({ source: "Meeting", from: mt.title || "Meeting", subject: "", text: txt, link: mt.share_link || "", at: mt.start || "" }); });

        .concat((state.inbox.items || []).map(function (s) { return "- " + s.text; })).join("\n");

        return "[" + i + "] " + m.source + (m.source === "Meeting" ? ": " : " from ") + (m.from || "unknown") + (m.subject ? " | subject: " + m.subject : "") + " | " +
          m.text.replace(/\s+/g, " ").slice(0, m.source === "Meeting" ? 1500 : 300);

        "Meeting next steps name an owner in parentheses: include one only if the owner is Praveen, or it is a ZoomRx/team item with no other named person. Wispr notes are his own jottings: include clear to-dos from them.\n" +
        "Ignore: newsletters, marketing, webinars, automated birthday/holiday greetings, general FYIs, messages that need nothing from him, and anything already on his list below.\n" +
        "Merge duplicates (e.g. repeated reminders about the same thing) into one item. Messages marked 'Praveen (you)' are his own: include a task only if he promised to do something.\n\n" +

      var ck = d.clear === "bought" ? "bought" : "done";
      var snapC = snapshot(), gone = state.tasks.filter(function (x) { return x.sec === ck && visible(x); }).length;
      state.tasks = state.tasks.filter(function (x) { return !(x.sec === ck && visible(x)); });
      showToast("Cleared " + gone + (ck === "bought" ? " bought item" : " done task") + (gone === 1 ? "" : "s"), snapC); changed(); return;
    }
  });

  root.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.id === "rAdd") {
      var rv = (document.getElementById("rAddInput").value || "").trim(); if (!rv) return;
      state.routines.push({ id: "r" + (state.nextId++), name: rv, times: 1 }); changed();
      var ra = document.getElementById("rAddInput"); if (ra) ra.focus(); return;
    }
    if (f.dataset && f.dataset.rform) {
      var rr = findR(f.dataset.rform), nv = (f.querySelector("input").value || "").trim();
      if (rr && nv) rr.name = nv; editR = null; openR = null; changed(); return;
    }
    if (f.dataset && f.dataset.editform) {
      var t = find(f.dataset.editform), v = (f.querySelector("input").value || "").trim();
      if (t && v) t.text = v;
      editId = null; openId = null; changed(); return;
    }
    var input = document.getElementById("addInput");
    var text = (input.value || "").trim(); if (!text) return;
    var task = { id: "t" + (state.nextId++), text: text, sec: filter === "shop" ? "shop" : addSec };
    if (filter !== "shop") task.tag = filter === "work" ? "Work" : (addTag || "Personal");
    state.tasks.unshift(task);
    if (collapsed[task.sec]) { collapsed[task.sec] = false; saveCollapsed(); }
    focusAdd = true; changed();
  });

  /* Drag to reorder: grab the dotted handle, drop anywhere in Now / Next / Later / Done (or on a collapsed section's header). */
  /* Drag a task by its dotted handle. */
  var drag = null, press = null;
  root.addEventListener("pointerdown", function (ev) {
    suppressClick = false;
    var g = ev.target.closest(".grip"); if (!g || drag || ev.button > 0) return;
    ev.preventDefault();
    startDrag(g.closest(".task"), g, ev.clientX, ev.clientY, ev.pointerId);
  });
  function cancelPress() { if (press) { clearTimeout(press.timer); press = null; } }
  document.addEventListener("touchmove", function (ev) { if (drag) ev.preventDefault(); }, { passive: false });
  function startDrag(li, g, cx, cy, pid) {
    suppressClick = true;
    var r = li.getBoundingClientRect();
    var ghost = li.cloneNode(true);
    ghost.className = "task ghost" + (li.classList.contains("done") ? " done" : "");
    ghost.style.cssText = "width:" + r.width + "px;left:" + r.left + "px;top:" + r.top + "px;--c:" + getComputedStyle(li.closest("section")).getPropertyValue("--c");
    document.body.appendChild(ghost);
    var ph = document.createElement("li"); ph.className = "placeholder"; ph.style.height = (li.querySelector(".task-main").offsetHeight - 8) + "px";
    li.parentNode.insertBefore(ph, li); li.style.display = "none";
    drag = { id: li.dataset.id, li: li, ghost: ghost, ph: ph, dy: cy - r.top, x: cx, y: cy, y0: cy, moved: false, head: null };
    document.body.classList.add("dragging");
    try { g.setPointerCapture(pid); } catch (e) {}
    requestAnimationFrame(autoScroll);
  }
  function setHead(h) {
    if (drag.head && drag.head !== h) drag.head.classList.remove("drop");
    drag.head = h; if (h) h.classList.add("drop");
    drag.ph.style.display = h ? "none" : "";
  }
  function dragTo(x, y) {
    drag.ghost.style.top = (y - drag.dy) + "px";
    var el = document.elementFromPoint(x, y); if (!el) return;
    var head = el.closest(".sec-head");
    if (head) {
      var sec = head.closest("section");
      if (sec.classList.contains("collapsed")) { setHead(head); return; }
      setHead(null); var l = sec.querySelector(".list"); l.insertBefore(drag.ph, l.firstChild); return;
    }
    var t = el.closest(".task, .empty");
    if (!t || t === drag.ph || t.classList.contains("ghost")) return;
    setHead(null);
    if (t.classList.contains("empty")) { t.parentNode.insertBefore(drag.ph, t); return; }
    var rr = t.getBoundingClientRect();
    t.parentNode.insertBefore(drag.ph, y < rr.top + rr.height / 2 ? t : t.nextSibling);
  }
  function autoScroll() {
    if (!drag) return;
    if (!drag.moved) { requestAnimationFrame(autoScroll); return; }
    var m = 80, v = 0, H = window.innerHeight;
    if (drag.y < m) v = -(m - drag.y) / 4; else if (drag.y > H - m) v = (drag.y - (H - m)) / 4;
    if (v) { window.scrollBy(0, v); dragTo(drag.x, drag.y); }
    requestAnimationFrame(autoScroll);
  }
  document.addEventListener("pointermove", function (ev) {
    if (press && !drag) { if (Math.abs(ev.clientX - press.x) > 8 || Math.abs(ev.clientY - press.y) > 8) cancelPress(); return; }
    if (!drag) return; ev.preventDefault();
    drag.x = ev.clientX; drag.y = ev.clientY; if (Math.abs(drag.y - drag.y0) > 8) drag.moved = true; dragTo(ev.clientX, ev.clientY);
  }, { passive: false });
  function endDrag(cancel) {
    var d = drag; drag = null;
    document.body.classList.remove("dragging"); d.ghost.remove();
    var sec = null, beforeId = null, atTop = false;
    if (d.head) { sec = d.head.closest("section").dataset.sec; atTop = true; }
    else {
      var s = d.ph.closest("section"); sec = s && s.dataset.sec;
      var n = d.ph.nextElementSibling;
      while (n && (!n.dataset.id || n === d.li)) n = n.nextElementSibling;
      beforeId = n ? n.dataset.id : null;
    }
    var t = find(d.id);
    if (cancel || !sec || !t) { render(); return; }
    var before = snapshot(), prev = t.sec;
    state.tasks = state.tasks.filter(function (x) { return x !== t; });
    if (isDoneSec(sec) && !isDoneSec(prev)) { t.from = prev; t.doneAt = today(); }
    if (!isDoneSec(sec) && isDoneSec(prev)) { delete t.from; delete t.doneAt; }
    t.sec = sec;
    var idx = -1, i;
    if (beforeId) { for (i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === beforeId) { idx = i; break; } }
    else if (atTop) { for (i = 0; i < state.tasks.length; i++) if (state.tasks[i].sec === sec) { idx = i; break; } }
    else { for (i = state.tasks.length - 1; i >= 0; i--) if (state.tasks[i].sec === sec) { idx = i + 1; break; } }
    if (idx < 0) state.tasks.push(t); else state.tasks.splice(idx, 0, t);
    openId = null; editId = null;
    if (snapshot() === before) { render(); return; }
    if (sec !== prev) showToast("Moved to " + (sec === "shop" ? "To buy" : sec.charAt(0).toUpperCase() + sec.slice(1)) + ": " + t.text, before);
    changed();
  }
  document.addEventListener("pointerup", function () { cancelPress(); if (drag) endDrag(false); });
  document.addEventListener("pointercancel", function () { cancelPress(); if (drag) endDrag(true); });


  render();

  var tries = 0;
  (function connect() {
    if (!(window.claude && window.claude.use)) {
      if (++tries < 40) return setTimeout(connect, 250);
      canSave = false; setSync("warn", "Open in Claude to save"); return;
    }
    window.claude.use("artifact").then(function (a) {
      artifact = a;
      if (a) { canSave = true; setSync("ok", "Synced"); }
      else { canSave = false; setSync("warn", "View only"); }
    }).catch(function () { canSave = false; setSync("warn", "View only"); });
  })();
})();
</script>
</body>
